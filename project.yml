name: UpworkMonitor
options:
  bundleIdPrefix: com.hina
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
targets:
  UpworkMonitor-iOS:
    type: application
    platform: iOS
    sources:
      - path: UpworkMonitor
        excludes:
          - "**/*.plist"
          - "**/*.entitlements"
          - "**/Assets/UpworkMonitorIcon-source.png"
    settings:
      base:
        SWIFT_VERSION: "6.0"
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "0.1.0"
        PRODUCT_BUNDLE_IDENTIFIER: com.hina.UpworkMonitor.ios
        PRODUCT_NAME: UpworkMonitor
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    entitlements:
      path: UpworkMonitor/UpworkMonitor-iOS.entitlements
      properties: {}
    info:
      path: UpworkMonitor/Info-iOS.plist
      properties:
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: com.hina.UpworkMonitor.oauth
            CFBundleURLSchemes:
              - com.hina.upworkmonitor.ios
  UpworkMonitor-macOS:
    type: application
    platform: macOS
    sources:
      - path: UpworkMonitor
        excludes:
          - "**/*.plist"
          - "**/*.entitlements"
          - "**/Assets/UpworkMonitorIcon-source.png"
    settings:
      base:
        SWIFT_VERSION: "6.0"
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "0.1.0"
        PRODUCT_BUNDLE_IDENTIFIER: com.hina.UpworkMonitor.macos
        PRODUCT_NAME: UpworkMonitor
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    entitlements:
      path: UpworkMonitor/UpworkMonitor-macOS.entitlements
      properties: {}
    info:
      path: UpworkMonitor/Info-macOS.plist
      properties:
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: com.hina.UpworkMonitor.oauth
            CFBundleURLSchemes:
              - com.hina.upworkmonitor.macos
